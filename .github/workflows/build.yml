name: Build mod

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: yogurines-core-jar
          path: build/libs/*.jar

      - name: Release (latest build)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Yogurines Core · build ${{ github.run_number }}
          body: |
            Versión automática de Yogurines Core (menú de Los Yogurines VI) para Minecraft 1.20.1 (Forge).
            Descarga el .jar de abajo y ponlo en la carpeta `mods` de tu instancia. Es solo de cliente: el servidor no lo necesita.
          files: build/libs/*.jar
          make_latest: true
